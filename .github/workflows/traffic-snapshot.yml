# Weekly GitHub traffic snapshot into metrics/traffic.json.
#
# The traffic API retains only 14 days, so a missed fortnight is unrecoverable;
# a weekly cron gives 2x margin. Requires the TRAFFIC_PAT repo secret (a
# fine-grained PAT scoped to this repo with Repository permissions ->
# Administration: Read-only), because the built-in GITHUB_TOKEN cannot read
# the traffic endpoints.
#
# The commit message carries [skip ci] so Cloudflare Workers Builds does not
# redeploy the app for a data-only commit.
name: traffic-snapshot

on:
  schedule:
    - cron: '13 9 * * 1' # Mondays 09:13 UTC
  workflow_dispatch: {} # manual run: Actions tab -> traffic-snapshot -> Run workflow

permissions:
  contents: write

concurrency: traffic-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and merge traffic data
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
        run: node .github/scripts/traffic-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name 'traffic-snapshot'
          git config user.email 'actions@users.noreply.github.com'
          git add metrics/traffic.json
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'chore(metrics): traffic snapshot [skip ci]'
          git pull --rebase origin main
          git push
