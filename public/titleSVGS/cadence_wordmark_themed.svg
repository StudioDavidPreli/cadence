<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" class="cadence-hero">
  <style>
    .cadence-hero {
      --hero-glyph: #e1e1e1;
      --hero-outline: #76c17d;
    }
    @media (prefers-color-scheme: light) {
      .cadence-hero {
        --hero-glyph: #1a1a1a;
        --hero-outline: #b9b0ff;
      }
    }
    /* after the scheme rules so it wins in both light and dark */
    @media (prefers-contrast: more) {
      .cadence-hero {
        --hero-glyph: #e8b86d;
        --hero-outline: #262626;
      }
    }
    /* manual hooks for app-controlled theme switching (work when the SVG is inlined) */
    [data-theme="dark"] .cadence-hero {
      --hero-glyph: #e1e1e1;
      --hero-outline: #76c17d;
    }
    [data-theme="light"] .cadence-hero {
      --hero-glyph: #1a1a1a;
      --hero-outline: #b9b0ff;
    }
    [data-theme="high-contrast-dark"] .cadence-hero,
    [data-theme="high-contrast-light"] .cadence-hero {
      --hero-glyph: #e8b86d;
      --hero-outline: #262626;
    }
  </style>
