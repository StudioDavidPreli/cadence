<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence: the motion system explorer</title>

    <!-- SEO + social preview. The description reuses the README's one-line framing.
         og:url and og:image are absolute on the production origin: a link scraper
         renders the card off-site, where relative URLs do not resolve. og:image is
         the 1200x630 PNG at public/favIcon/og-image.png, served at /favIcon/. -->
    <meta name="description" content="A motion design system explorer built for designers learning how animation tokens drive UI behavior." />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />

    <link rel="canonical" href="https://cadence.davidpreli.com/" />

    <meta property="og:title" content="Cadence: the motion system explorer" />
    <meta property="og:description" content="A motion design system explorer built for designers learning how animation tokens drive UI behavior." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cadence.davidpreli.com/" />
    <meta property="og:image" content="https://cadence.davidpreli.com/favIcon/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cadence: the motion system explorer" />
    <meta name="twitter:description" content="A motion design system explorer built for designers learning how animation tokens drive UI behavior." />
    <meta name="twitter:image" content="https://cadence.davidpreli.com/favIcon/og-image.png" />

    <!-- SVG favicon. Case-sensitive path: matches public/favIcon/favIcon.svg 1:1. -->
    <link rel="icon" type="image/svg+xml" href="/favIcon/favIcon.svg" />

    <!-- Resolve the theme before first paint so the OS preference is honored and a
         stored choice never flashes the default palette. Runs synchronously in
         <head>, setting data-theme before any CSS applies. Resolution order:
         stored choice, then OS prefers-contrast / prefers-color-scheme, else dark.
         ThemeContext adopts this same attribute on mount (resolveInitialTheme),
         so React and the DOM agree with no second resolution. Keep the order here
         in sync with src/context/ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var valid = ['light', 'dark', 'high-contrast-light', 'high-contrast-dark']
          var stored = localStorage.getItem('cadence-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme
          if (valid.indexOf(stored) !== -1) {
            theme = stored
          } else if (window.matchMedia('(prefers-contrast: more)').matches) {
            // High-contrast request still honors the OS light/dark preference so
            // the contrast bump does not also flip the user's day/night choice.
            theme = prefersLight ? 'high-contrast-light' : 'high-contrast-dark'
          } else if (prefersLight) {
            theme = 'light'
          } else {
            theme = 'dark'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <!-- IBM Plex Mono: token values, code, monospaced labels (400 regular, 500 medium) -->
    <!-- DM Serif Display: editorial headings — ital@0;1 loads both upright and italic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
